services:
  mongodb:
    image: mongo:8
    restart: unless-stopped

    volumes:
      - mongodb_data:/data/db

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped

    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: 1

    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api

  bot:
    build: .
    restart: unless-stopped

    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      MONGO_URI: ${MONGO_URI}

    depends_on:
      - mongodb
      - telegram-bot-api

    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
      - originals_data:/storage/originals
      - converted_data:/storage/converted

volumes:
  mongodb_data:
  telegram_bot_api_data:

  originals_data:
    name: video_note_originals

  converted_data:
    name: video_note_converted